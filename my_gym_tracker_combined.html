<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Gym Tracker"><title>My Gym Tracker</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173b2b;background:#f1f5f0}*{box-sizing:border-box}body{margin:0}header{background:#153d2b;color:#fff;padding:calc(env(safe-area-inset-top) + 17px) 16px 15px}h1{font-size:23px;margin:0 0 13px}.tabs{display:flex;gap:10px}.tabs button{flex:1;border:0;border-radius:13px;background:#e5efe7;color:#234b36;padding:13px 7px;font-size:16px;font-weight:750}.tabs button[aria-selected="true"]{background:#fff;color:#153d2b;box-shadow:0 2px 8px #0002}iframe{display:block;width:100%;height:calc(100dvh - 143px - env(safe-area-inset-top));min-height:480px;border:0;background:#f1f5f0}footer{padding:8px 14px 14px;font-size:12px;color:#5e7265;text-align:center}a{color:#28583f}
</style></head><body><header><h1>💪 My Gym Tracker</h1><nav class="tabs" aria-label="Choose programme"><button id="personal" type="button" aria-selected="true" onclick="switchTo('personal')">My Training</button><button id="clients" type="button" aria-selected="false" onclick="switchTo('clients')">My Clients</button></nav></header><iframe id="view" title="My training" src="index.html" loading="eager"></iframe><footer>Existing programmes are kept in their original files. <a id="direct" href="index.html">Open this page directly</a></footer><script>
const pages={personal:{url:'index.html',title:'My training'},clients:{url:'jonnie_pt_dashboard_ready.html',title:'My clients'}};
function switchTo(tab){const p=pages[tab];document.getElementById('personal').setAttribute('aria-selected',String(tab==='personal'));document.getElementById('clients').setAttribute('aria-selected',String(tab==='clients'));const frame=document.getElementById('view');if(frame.getAttribute('src')!==p.url)frame.setAttribute('src',p.url);frame.title=p.title;document.getElementById('direct').href=p.url;}
</script></body></html>
